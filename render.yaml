services:
  - type: web_service
    name: chargebackpilot
    env: node
    plan: free
    region: frankfurt
    branch: main
    root: .
    buildCommand: pnpm run build:render
    startCommand: pnpm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: BASE_PATH
        value: /
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_FALLBACK
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        value: 0x4AAAAAADYBEjhoZ0EEJ7WK
      - key: REQUIRE_TURNSTILE_ON_CASE_CREATE
        value: 1
      - key: PORT
        value: 10000
