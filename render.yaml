services:
  - type: web_service
    name: chargebackpilot
    env: node
    plan: free
    region: frankfurt
    branch: main
    root: .
    buildCommand: pnpm install && BASE_PATH=/ pnpm --filter @workspace/chargeback-pilot run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: BASE_PATH
        value: /
      - key: NODE_ENV
        value: production
